/var/log/val-protection/val-protection.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0600 valprotection valprotection
    postrotate
        systemctl kill -s HUP val-protection.service >/dev/null 2>&1 || true
    endscript
}

/var/log/val-protection/*.jsonl {
    weekly
    rotate 52
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0600 valprotection valprotection
}
